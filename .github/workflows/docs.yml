name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update
      - run: sudo apt-get install -y fonts-noto-cjk poppler-utils
      - run: python -m playwright install --with-deps chromium
      - run: mkdocs build --strict
      # after `mkdocs build`, which wipes site/
      - run: python scripts/build_pdf.py
      - run: python scripts/check_pdf.py
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pdf
          path: site/pdf/*.pdf
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
