site_name: Focalcrest RF Test Guide
site_url: https://mixtile-rockchip.github.io/focalcrest-rf-test-guide/
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - content.code.copy
    - toc.integrate
nav:
  - Home: index.md
  - Products: products.md
  - Firmware changelog: changelog.md
  - 1 · Flash test image: flashing.md
  - 2 · WiFi / BT RF test: wifibt-test.md
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          site_name: Focalcrest 射频测试指南
          nav_translations:
            Home: 首页
            Products: 产品
            Firmware changelog: 固件变更记录
            1 · Flash test image: 1 · 烧录测试镜像
            2 · WiFi / BT RF test: 2 · WiFi / 蓝牙射频测试
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
